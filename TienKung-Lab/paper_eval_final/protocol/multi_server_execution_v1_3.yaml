document_type: execution_addendum
protocol_version: "1.3"
status: portable_checkpoint_identity
does_not_change_protocol_hash: true
baseline_evaluation_tag: paper-eval-v1.3-frozen
baseline_evaluation_commit: 4434d384cea959025a31c4fad1fd056b3fc017f5
protocol_hash: b71a1ddf929395629d34d4afc454f12a665f47beb3a92b6fca068a41cf9d3064
evaluation_compatibility: executable_code_hash_not_repository_head
flexible_checkpoint_evaluation_code_hash: bf8599df7510c496ca6d45687a321c0e54236ece76c35da30e4eb5d770e34304

checkpoint_contract:
  globally_frozen_checkpoint: false
  user_may_select_checkpoint_per_task: true
  registered_checkpoints_are_defaults_only: true
  user_selected_checkpoint_requires_train_seed: true
  checkpoint_sha256_computed_by_runner: true
  estimator_may_be_selected_per_task: true
  different_checkpoint_hashes_are_separate_shards: true
  different_checkpoint_hashes_are_not_implicitly_pooled: true

seed_contract:
  formula: eval_seed = stage_seed_namespace + experiment_id * 1000000 + global_sequence
  worker_id_participates: false
  hostname_participates: false
  gpu_id_participates: false
  server_specific_offset_prohibited: true
  paired_across_models: true
  namespaces:
    screening: 1301000
    pilot: 1302000
    formal: 1303000
  formal_first_eval_seed:
    experiment_1: 2303000
    experiment_2: 3303000
    experiment_3: 4303000

task_dispatch:
  mode: user_defined_natural_language
  protocol_prescribes_task_menu: false
  server_identity_required: false
  user_may_select:
    - any_supported_model_with_a_user_selected_checkpoint
    - any_protocol_stage
    - any_protocol_experiment_or_combination
  server_responsibilities:
    - map_the_user_request_to_the_existing_protocol_cli_without_changing_the_protocol
    - read_the_frozen_protocol_and_implementation_freeze
    - verify_code_tag_manifest_and_checkpoint_hashes
    - resume_existing_matching_shards_instead_of_restarting_trials
    - keep_pilot_and_formal_data_separate
    - produce_complete_sealed_shards_for_central_aggregation
  fail_closed_rule: reject_requests_that_conflict_with_the_frozen_protocol_and_explain_the_conflict

ownership:
  minimum_unit: complete_model_experiment_shard
  assignment_policy: user_selected_before_execution
  protocol_assigns_models_to_servers: false
  server_count: 3
  servers_interchangeable: true
  shard_key:
    - protocol_hash
    - stage
    - experiment_id
    - model_id
    - train_seed
    - checkpoint_sha256
    - estimator_sha256
    - manifest_hash
  single_writer_required: true
  assignments: {}
  user_assignment_constraints:
    - Any server may evaluate any supported model and checkpoint selected by the user.
    - The same model may run on different servers when they own different stage or experiment shards.
    - Different servers may evaluate the same or different models with the same paired manifest and eval seeds.
    - The same model-experiment shard must not be written by more than one server.
  models_without_default_checkpoint:
    M3: pass_checkpoint_and_train_seed_at_dispatch
    M4: pass_checkpoint_and_train_seed_at_dispatch

current_resume_point:
  eligible_server: any_one_of_the_three_after_complete_verified_transfer
  owner_selected_by_user: true
  stage: formal
  experiment_id: 1
  model_id: M1
  train_seed: 42
  completed_candidates: 18384
  completed_global_sequence: [0, 18383]
  analysis_accepted: 882
  analysis_target: 1440
  next_batch_not_generated: true
  required_evaluation_tag: paper-eval-v1.3-frozen
  required_evaluation_code_hash: 1f35c261c44e280292a94947805c54bd300f036eee1fbcab043f9d6389a0cc45

merge_contract:
  central_layout: results/<stage>/<protocol_namespace>/experiment_<id>/<model_id>/train_seed_<seed>/checkpoint_<sha_prefix>[_estimator_<sha_prefix>]
  completed_shards_only: true
  copy_whole_shard: true
  overwrite_prohibited: true
  duplicate_key: [model_id, checkpoint_sha256, estimator_sha256, train_seed, trial_id]
  compatibility_gate:
    - protocol_version
    - stage
    - experiment_id
    - manifest_hash
    - metrics_config_hash
    - physics_profile_hash
    - evaluation_code_hash
    - asset_hash
    - simulator_version
  checkpoint_hash_computed_from_selected_file: true
  trial_and_eval_seed_uniqueness_required: true
  outcome_based_conflict_resolution_prohibited: true

notes:
  - The three interchangeable servers are compute workers; they are not training-seed repetitions.
  - Equal eval seeds across models are intentional common-random-number pairing.
  - Splitting one model-experiment shard across servers is prohibited until a tested global shard manifest exists.
