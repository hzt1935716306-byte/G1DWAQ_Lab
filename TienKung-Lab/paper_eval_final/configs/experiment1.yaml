experiment_id: 1
name: offline_certificate_relation
disturbance: velocity_jump
baseline_id: slope_nosys_d_matched
model_id: M1
checkpoint_sha256: 15167ca59f001a3f1888c894d43c14a2cb7321f48aab1b0a8eaabdd9e74ce848
relation_set: SHARED_MARGIN_TERTILE_SET
screening_candidates: 80
accepted_Nmin: [2, 3, 4]
fixed_budget_natural_distribution_include_all_certificate_valid_Nmin: true
superseded_scope_data:
  former_target_Nmin: [3, 4, 5]
  retain_Nmin5_in_natural_distribution: true
  calibration_carryover_allowed_Nmin: [2, 3, 4]
  carryover_requirements:
    - same_checkpoint_physics_metrics_and_candidate_generation
    - certificate_valid_and_raw_finite_float64_margin
    - fixed_trial_order
    - no_recovery_outcome_filtering
policy_must_not_receive_certificate: true
record_fields:
  - stage
  - sample_role
  - certificate_valid
  - Nmin
  - margin_raw
  - margin_group
  - shared_q1
  - shared_q2
  - calibration_only
  - margin_degenerate
  - trial_id
  - eval_seed
  - calibration_manifest_hash
  - evaluation_manifest_hash
pilot_sampling:
  initial_candidates: 500
  continuation_batch_candidates: 2048
  max_candidates_total: 100000
calibration_sampling:
  certificate_valid_per_Nmin: 120
  total_selected: 360
  targeting_rule: deficit_round_robin_smoothed_certificate_Nmin_yield
  targeting_top_condition_layers: 8
  acceptance_fields: [stage, certificate_valid, Nmin, margin_raw]
  prohibited_acceptance_fields: [task_outcome, recovered_sustained, recovery_time, nTD0, Krec, Krec_physical]
  boundary_formula: shared_midpoint_of_pooled_order_statistics_120_121_and_240_241
  boundaries_file: configs/experiment1_margin_boundaries.yaml
margin_variation_guard:
  minimum_unique_values: 12
  minimum_absolute_range: 1.0e-6
  minimum_robust_range: 1.0e-4
  minimum_robust_to_pooled_ratio: 0.01
pilot_analysis_sampling:
  certificate_valid_per_cell: 40
  total_selected: 360
  targeting_rule: deficit_round_robin_smoothed_shared_margin_cell_yield
  targeting_top_condition_layers: 8
  acceptance_fields: [stage, condition_id, certificate_valid, Nmin, margin_raw, margin_group]
  prohibited_acceptance_fields: [task_outcome, recovered_sustained, recovery_time, nTD0, Krec, Krec_physical]
formal_sampling:
  initial_candidates: 2000
  certificate_valid_per_cell: 160
  total_selected: 1440
  continuation_batch_candidates: 2048
  max_candidates_total: null
  max_candidates_per_condition_layer: null
  targeting_top_condition_layers: 8
  acceptance_fields: [stage, condition_id, certificate_valid, Nmin, margin_raw]
  prohibited_acceptance_fields: [task_outcome, recovered_sustained, recovery_time, nTD0, Krec, Krec_physical]
  boundaries_file: configs/experiment1_margin_boundaries.yaml
